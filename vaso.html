<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conserva — Scheda vasetto</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root{
    --kraft: #e7dcc6;
    --kraft-dark: #d8c9a8;
    --card: #faf6ee;
    --tomato: #b8410f;
    --tomato-deep: #8f3009;
    --basil: #46603a;
    --ink: #2b2620;
    --ink-soft: #6b6255;
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px;
    background:
      radial-gradient(circle at 20% 10%, rgba(184,65,15,0.05), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(70,96,58,0.06), transparent 45%),
      var(--kraft);
    background-attachment: fixed;
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
  }

  .label{
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 4px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset, 0 18px 40px -20px rgba(43,38,32,0.45);
    position: relative;
    overflow: hidden;
  }

  .label::before{
    content:"";
    position:absolute; inset:10px;
    border: 1px dashed rgba(43,38,32,0.18);
    pointer-events:none;
  }

  .stamp{
    background: var(--tomato);
    color: #fbf0e6;
    padding: 22px 28px 18px;
    position: relative;
  }
  .stamp .eyebrow{
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0.85;
    margin: 0 0 6px;
  }
  .stamp h1{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    margin: 0;
  }
  .stamp .vaso-num{
    position:absolute;
    top: 18px; right: 20px;
    font-size: 12px;
    background: rgba(0,0,0,0.18);
    border-radius: 20px;
    padding: 4px 12px;
    letter-spacing: 0.05em;
  }

  .body{ padding: 22px 28px 26px; }

  .row{
    display:flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid rgba(43,38,32,0.1);
    font-size: 13.5px;
  }
  .row:last-child{ border-bottom:none; }
  .row .k{
    color: var(--ink-soft);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding-top: 2px;
    white-space: nowrap;
  }
  .row .v{
    text-align: right;
    font-weight: 600;
    max-width: 62%;
  }

  .coord{
    display:block;
    margin-top: 5px;
    font-size: 10.5px;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
  }
  .geo{
    display:inline-block;
    margin-top: 3px;
    font-size: 11px;
    font-weight: 600;
    color: var(--basil);
    text-decoration: none;
    border-bottom: 1px solid rgba(70,96,58,0.4);
  }
  .geo:hover{ color: var(--tomato); border-bottom-color: var(--tomato); }

  .note{
    margin-top: 16px;
    padding: 12px 14px;
    background: rgba(70,96,58,0.08);
    border-left: 3px solid var(--basil);
    font-size: 12.5px;
    color: var(--basil);
    font-style: italic;
    display:none;
  }

  .footer{
    text-align:center;
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: 0.06em;
    padding: 14px 0 20px;
  }

  .state{
    font-family: 'JetBrains Mono', monospace;
    text-align:center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 13px;
  }
</style>
</head>
<body>

  <div class="label" id="label" style="display:none">
    <div class="stamp">
      <p class="eyebrow">Passata di pomodoro</p>
      <h1 id="titolo">Vasetto</h1>
      <span class="vaso-num" id="numero">#000</span>
    </div>
    <div class="body">
      <div class="row"><span class="k">Varietà</span><span class="v" id="varieta">—</span></div>
      <div class="row"><span class="k">Luogo coltivazione</span><span class="v" id="luogo_coltivazione">—</span></div>
      <div class="row"><span class="k">Raccolta pomodori</span><span class="v" id="data_raccolta">—</span></div>
      <div class="row"><span class="k">Produzione conserva</span><span class="v" id="data_produzione">—</span></div>
      <div class="row"><span class="k">Confezionamento</span><span class="v" id="luogo_confezionamento">—</span></div>
      <div class="row"><span class="k">Ingredienti</span><span class="v" id="ingredienti">—</span></div>
      <div class="row"><span class="k">Peso netto</span><span class="v" id="peso_netto">—</span></div>
      <div class="row"><span class="k">Lotto</span><span class="v" id="lotto">—</span></div>
      <div class="row"><span class="k">Da consumarsi entro</span><span class="v" id="scadenza">—</span></div>
      <div class="note" id="note"></div>
    </div>
    <div class="footer">fatto a mano — nessun conservante aggiunto</div>
  </div>

  <div class="state" id="state">Caricamento scheda…</div>

<script>
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
              'luglio','agosto','settembre','ottobre','novembre','dicembre'];

// "2026-07-28" -> "28 luglio 2026"; lascia il testo com'è se non è una data ISO
function dataIt(s){
  if(!s) return '—';
  const m = String(s).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s;
  return parseInt(m[3],10) + ' ' + MESI[parseInt(m[2],10)-1] + ' ' + m[1];
}

// Riempie una riga "luogo": indirizzo, coordinate e link a Google Maps.
// Le coordinate sono accettate come "45.649132, 12.458709" o "(45.649132 12.458709)".
function luogo(campo, testo, gps){
  const el = document.getElementById(campo);
  el.textContent = testo || (gps ? '' : '—');
  if(!gps) return;
  const m = String(gps).replace(/[()]/g, '').trim()
    .match(/^\s*(-?\d+(?:\.\d+)?)\s*[,; ]\s*(-?\d+(?:\.\d+)?)\s*$/);
  if(!m) return;
  const lat = m[1], lon = m[2];

  const coord = document.createElement('span');
  coord.className = 'coord';
  coord.textContent = lat + ', ' + lon;
  el.appendChild(coord);

  const a = document.createElement('a');
  a.className = 'geo';
  a.href = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = 'Apri in Google Maps';
  el.appendChild(a);
}

async function load(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const stateEl = document.getElementById('state');

  if(!id){
    stateEl.textContent = 'Nessun numero di vasetto specificato (manca ?id=... nell\'indirizzo).';
    return;
  }

  try{
    const res = await fetch('data.json');
    if(!res.ok) throw new Error('data.json non raggiungibile');
    const data = await res.json();
    const v = data[id];

    if(!v){
      stateEl.textContent = 'Nessuna scheda trovata per il vasetto n. ' + id + '.';
      return;
    }

    document.getElementById('titolo').textContent = v.nome_prodotto || 'Conserva di pomodoro';
    document.title = (v.nome_prodotto || 'Conserva') + ' — vasetto ' + id;
    document.getElementById('numero').textContent = '#' + id;
    document.getElementById('varieta').textContent = v.varieta_pomodoro || '—';
    document.getElementById('data_raccolta').textContent = dataIt(v.data_raccolta);
    document.getElementById('data_produzione').textContent = dataIt(v.data_produzione);
    document.getElementById('ingredienti').textContent = v.ingredienti || '—';

    luogo('luogo_coltivazione', v.luogo_coltivazione, v.gps_coltivazione);
    luogo('luogo_confezionamento', v.luogo_confezionamento, v.gps_confezionamento);
    document.getElementById('peso_netto').textContent = v.peso_netto || '—';
    document.getElementById('lotto').textContent = v.lotto || '—';
    document.getElementById('scadenza').textContent = dataIt(v.scadenza);

    if(v.note){
      const noteEl = document.getElementById('note');
      noteEl.textContent = v.note;
      noteEl.style.display = 'block';
    }

    stateEl.style.display = 'none';
    document.getElementById('label').style.display = 'block';
  }catch(err){
    stateEl.textContent = 'Errore nel caricamento dei dati: ' + err.message;
  }
}
load();
</script>

</body>
</html>
